version: 1
name: hierarchical-provider-seed123-confirmation
hypothesis: >-
  The provider-routed architecture that led on the seed-42 split retains its
  advantage over flat char 2-5 on a second deterministic prompt-group split.
output_path: reports/tuning/hierarchical-provider-seed123/summary.json

candidates:
  flat_char_2_5:
    type: char_tfidf
    analyzer: char
    ngram_range: [2, 5]
    min_df: 2
    max_features: 100000
    sublinear_tf: true
    c: 1.0
    classifier: svc
    architecture: flat

  hier_char_2_5:
    type: char_tfidf
    analyzer: char
    ngram_range: [2, 5]
    min_df: 2
    max_features: 100000
    sublinear_tf: true
    c: 1.0
    classifier: svc
    architecture: hierarchical
