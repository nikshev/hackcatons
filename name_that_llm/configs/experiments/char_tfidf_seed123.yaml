version: 1
name: char-tfidf-seed123-confirmation
hypothesis: >-
  The [2, 5] character n-gram range that led the first fixed-fold sweep will
  retain its advantage over the current [3, 5] char baseline on a second
  deterministic prompt-group split.
output_path: reports/tuning/char-tfidf-seed123/summary.json

candidates:
  char_baseline:
    type: char_tfidf
    analyzer: char
    ngram_range: [3, 5]
    min_df: 2
    max_features: 100000
    sublinear_tf: true
    c: 1.0

  char_ngram_2_5:
    type: char_tfidf
    analyzer: char
    ngram_range: [2, 5]
    min_df: 2
    max_features: 100000
    sublinear_tf: true
    c: 1.0
