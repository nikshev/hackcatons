version: 1
name: sbert-logreg-v1
hypothesis: >-
  Frozen MiniLM embeddings with logistic regression generalize better across
  unseen prompts than sparse char TF-IDF, improving prompt-held-out balanced
  accuracy on the same five saved folds.
embedding_model_dir: models/all-MiniLM-L6-v2
embedding_model_name: all-MiniLM-L6-v2
output_path: reports/tuning/sbert-logreg-v1/summary.json

candidates:
  flat_char_2_5:
    type: char_tfidf
    analyzer: char
    ngram_range: [2, 5]
    min_df: 2
    max_features: 100000
    sublinear_tf: true
    c: 1.0
    classifier: svc
    architecture: flat

  sbert_minilm_logreg:
    type: sbert_logreg
    c: 1.0
    max_iter: 1000
    architecture: flat
