version: 1
name: char-logreg-vs-svc-v1
hypothesis: >-
  Multinomial logistic regression on identical char 2-5 TF-IDF features may
  improve prompt-held-out balanced accuracy over LinearSVC by better handling
  the confused Gemini/GLM classes.
output_path: reports/tuning/char-logreg-vs-svc-v1/summary.json

candidates:
  char_svc_2_5:
    type: char_tfidf
    analyzer: char
    ngram_range: [2, 5]
    min_df: 2
    max_features: 100000
    sublinear_tf: true
    c: 1.0
    classifier: svc

  char_logreg_2_5:
    type: char_tfidf
    analyzer: char
    ngram_range: [2, 5]
    min_df: 2
    max_features: 100000
    sublinear_tf: true
    c: 1.0
    classifier: logreg
