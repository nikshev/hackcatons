# Kaggle's current official Overview/Data pages are authoritative. Local files
# must still pass the audit before use; increment version and update CHANGELOG
# whenever a result-affecting configuration value changes.
version: 13
data:
  column_roles:
    id: id
    prompt_id: prompt_id
    text: text
    label: model
  files:
    train:
      path: kaggle/train.csv
      required_roles: [id, text, label]
      source: Kaggle Name That LLM
      retrieved_at: 2026-10-26; file first observed in workspace, source download time not recorded
      license_or_terms: Kaggle competition data; Rules section 4(a), checked 2026-10-26
    test:
      path: kaggle/test.csv
      required_roles: [id, text]
      source: Kaggle Name That LLM
      retrieved_at: 2026-10-26; file first observed in workspace, source download time not recorded
      license_or_terms: Kaggle competition data; Rules section 4(a), checked 2026-10-26

competition:
  # Official Kaggle Rules §4(a) permits use of Competition Data for participation.
  rules_verified: true
  eligibility_verified: false
  payout_verified: false
  allowed_labels:
    - gpt-5.5
    - gpt-5.6-luna
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-6-astra
    - gemini-3.1-pro-preview
    - gemini-3.6-flash
    - gemini-3.7-flash
    - gemini-3.8-flash
    - claude-fable-5
    - claude-opus-4-6
    - claude-opus-4-8
    - claude-opus-5
    - claude-sonnet-5
    - qwen3.8-max
    - glm-5.3
    - glm-5.3-flash
    - kimi-k3

report:
  path: reports/audit/audit.json

validation:
  prompt_group_role: prompt_id
  n_splits: 5
  seed: 42
  assignments_path: reports/splits/prompt_folds.parquet
  report_path: reports/splits/prompt_folds.json

training:
  artifact_root: reports/runs
  models:
    dummy_most_frequent:
      type: dummy
      strategy: most_frequent
    word_tfidf_svc:
      type: word_tfidf
      ngram_range: [1, 2]
      min_df: 2
      max_features: 80000
      sublinear_tf: true
      c: 1.0
    char_tfidf_svc:
      type: char_tfidf
      ngram_range: [2, 5]
      min_df: 2
      max_features: 100000
      sublinear_tf: true
      c: 1.0
    word_char_tfidf_svc:
      type: word_char_tfidf
      word_ngram_range: [1, 2]
      char_ngram_range: [3, 5]
      min_df: 2
      word_max_features: 50000
      char_max_features: 75000
      sublinear_tf: true
      c: 1.0
    style_svc:
      type: style_svc
      c: 1.0
      classifier: svc
    style_char_fusion:
      type: style_char_tfidf
      analyzer: char
      ngram_range: [2, 5]
      min_df: 2
      max_features: 100000
      sublinear_tf: true
      c: 1.0
      classifier: svc

inference:
  model_candidate: style_char_fusion
  selected_from_run: ebd7f3471379aa3e
  artifact_root: artifacts/final_models
  submission_output: reports/submissions/submission.parquet
